name: CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------------------------------
    # System Dependencies
    # -------------------------------------------------------------------------
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libasound2-dev \
          libpipewire-0.3-dev \
          libspa-0.2-dev \
          python3 \
          wget \
          file

    # -------------------------------------------------------------------------
    # VST3 Headers (required by main.cpp / arthur_bridge)
    # -------------------------------------------------------------------------
    - name: Clone VST3 plugin interfaces
      run: |
        mkdir -p vst3_headers
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_pluginterfaces.git \
          vst3_headers/pluginterfaces
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_base.git \
          vst3_headers/base

    # -------------------------------------------------------------------------
    # Build Linux-native targets (no Qt GUI in CI — too heavy)
    # -------------------------------------------------------------------------
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_GUI=OFF

    - name: Build all native targets
      run: cmake --build build --config Release -j$(nproc)

    # -------------------------------------------------------------------------
    # Run the stress test to validate lock-free IPC
    # -------------------------------------------------------------------------
    - name: Run Arthur IPC stress test
      run: |
        # Create XDG_RUNTIME_DIR so arthur-daemon uses a predictable socket path
        export XDG_RUNTIME_DIR=$(mktemp -d)
        chmod 700 "$XDG_RUNTIME_DIR"

        ./build/arthur-daemon &
        DAEMON_PID=$!
        sleep 2

        ./build/arthur_stress_test
        TEST_EXIT=$?

        kill $DAEMON_PID 2>/dev/null || true
        wait $DAEMON_PID 2>/dev/null || true
        exit $TEST_EXIT

    # -------------------------------------------------------------------------
    # Upload native binaries as CI artifact
    # -------------------------------------------------------------------------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arthur-native-binaries
        path: |
          build/arthur_bridge.so
          build/arthur-daemon
          build/pw_module_clls
          build/midi_sync
          build/arthur_stress_test
        if-no-files-found: error
        retention-days: 7
