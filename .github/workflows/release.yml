name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.0.0)'
        required: true

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------------------------------
    # System Dependencies
    # -------------------------------------------------------------------------
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libasound2-dev \
          libpipewire-0.3-dev \
          libspa-0.2-dev \
          python3 \
          wget \
          file \
          fuse \
          libfuse2 \
          netcat-openbsd

    # -------------------------------------------------------------------------
    # VST3 Headers
    # -------------------------------------------------------------------------
    - name: Clone VST3 plugin interfaces
      run: |
        mkdir -p vst3_headers
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_pluginterfaces.git \
          vst3_headers/pluginterfaces
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_base.git \
          vst3_headers/base

    # -------------------------------------------------------------------------
    # Build all native Linux targets
    # -------------------------------------------------------------------------
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_GUI=OFF

    - name: Build all native targets
      run: cmake --build build --config Release -j$(nproc)

    # -------------------------------------------------------------------------
    # Daemon IPC health check
    # -------------------------------------------------------------------------
    - name: Run daemon IPC health check
      run: |
        export XDG_RUNTIME_DIR=$(mktemp -d)
        chmod 700 "$XDG_RUNTIME_DIR"
        SOCK="${XDG_RUNTIME_DIR}/arthur.sock"

        ./build/arthur-daemon &
        DAEMON_PID=$!

        for i in $(seq 1 10); do
          [ -S "$SOCK" ] && break
          sleep 0.5
        done

        if [ ! -S "$SOCK" ]; then
          echo "[FAIL] Daemon socket did not appear"
          kill $DAEMON_PID 2>/dev/null || true
          exit 1
        fi

        RESPONSE=$(echo "LIST_SHM" | nc -U -q1 "$SOCK" 2>/dev/null || true)
        echo "[OK] Daemon IPC healthy. LIST_SHM response: '${RESPONSE}'"

        kill $DAEMON_PID 2>/dev/null || true
        wait $DAEMON_PID 2>/dev/null || true

    # -------------------------------------------------------------------------
    # Determine release version tag
    # -------------------------------------------------------------------------
    - name: Set release version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        fi

    # -------------------------------------------------------------------------
    # Package AppImage (Linux-native binaries + CLI)
    # -------------------------------------------------------------------------
    - name: Download appimagetool
      run: |
        wget -q \
          https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
          -O appimagetool.AppImage
        chmod +x appimagetool.AppImage

    - name: Assemble AppDir
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib/arthur

        # Copy native binaries
        cp build/arthur_bridge.so     AppDir/usr/lib/arthur/
        cp build/arthur-daemon        AppDir/usr/bin/
        cp build/pw_module_clls       AppDir/usr/bin/
        cp build/midi_sync            AppDir/usr/bin/

        # Copy scripts and CLI
        cp arthur-cli.py              AppDir/usr/bin/arthur-cli
        chmod +x                      AppDir/usr/bin/arthur-cli
        cp vdc_tune.sh                AppDir/usr/bin/
        cp arthur-installer-bridge.sh AppDir/usr/bin/
        cp arthur_tune_cachyos.sh     AppDir/usr/bin/
        chmod +x AppDir/usr/bin/*.sh

        # Pre-built Wine guest binaries (committed to repo under bin/)
        if [ -d bin ]; then
          for f in bin/*.exe bin/*.exe.so; do
            [ -f "$f" ] && cp "$f" AppDir/usr/bin/ || true
          done
        fi

        # Icon and desktop entry
        cp arthur.png AppDir/arthur.png
        cp AppRun     AppDir/AppRun
        chmod +x      AppDir/AppRun

        if [ -f arthur.desktop ]; then
          cp arthur.desktop AppDir/arthur.desktop
        else
          cat > AppDir/arthur.desktop <<'EOF'
[Desktop Entry]
Type=Application
Name=Arthur Translation Layer
Icon=arthur
Exec=arthur-cli
Categories=Audio;AudioVideo;
EOF
        fi

    - name: Build AppImage
      env:
        ARCH: x86_64
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        ./appimagetool.AppImage --appimage-extract-and-run \
          AppDir \
          "Arthur-${VERSION}-x86_64.AppImage"

    # -------------------------------------------------------------------------
    # Bundle a tarball of all native build artefacts
    # -------------------------------------------------------------------------
    - name: Create native binaries tarball
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        mkdir -p dist
        cp build/arthur_bridge.so  dist/
        cp build/arthur-daemon     dist/
        cp build/pw_module_clls    dist/
        cp build/midi_sync         dist/
        cp vdc_tune.sh             dist/
        cp arthur_tune_cachyos.sh  dist/
        cp arthur-installer-bridge.sh dist/
        # Pre-built Wine guests
        [ -d bin ] && cp bin/*.exe bin/*.exe.so dist/ 2>/dev/null || true
        tar -czf "arthur-native-${VERSION}-linux-x86_64.tar.gz" -C dist .

    # -------------------------------------------------------------------------
    # Create GitHub Release and upload all assets
    # -------------------------------------------------------------------------
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: "Arthur Translation Layer ${{ steps.version.outputs.VERSION }}"
        generate_release_notes: true
        files: |
          Arthur-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          arthur-native-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
