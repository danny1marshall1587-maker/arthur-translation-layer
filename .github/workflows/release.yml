name: Build and Release Arthur Translation Layer

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            build-essential \
            curl \
            wget \
            file \
            libwine-dev \
            wine

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get install -y flatpak flatpak-builder

      - name: Download VST3 Headers
        run: |
          mkdir -p vst3_headers
          git clone --depth 1 https://github.com/steinbergmedia/vst3_pluginterfaces.git vst3_headers/pluginterfaces
          git clone --depth 1 https://github.com/steinbergmedia/vst3_base.git vst3_headers/base

      - name: Build C++ Host Bridge & Daemons
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_GUI=OFF ..
          make -j$(nproc)

      - name: Build Wine Guest and Agent Binaries
        run: |
          wineg++ -O2 -I. guest.cpp -o build/arthur-guest.exe -lpthread
          wineg++ -O2 -I. -Ivst3_headers win_guest_agent.cpp vstiids.cpp -o build/win_guest_agent.exe -lpthread
          mkdir -p bin
          cp build/arthur-guest.exe bin/
          cp build/arthur-guest.exe.so bin/
          cp build/win_guest_agent.exe bin/
          cp build/win_guest_agent.exe.so bin/

      - name: Run Arthur Closed-Loop Stress Test
        run: |
          rm -f /tmp/arthur.sock
          ./build/arthur-daemon &
          sleep 2
          ./build/arthur_stress_test
          killall -9 arthur-daemon wine wineserver || true

      - name: Package Flatpak Bundle
        run: |
          # Clean CMake cache to prevent directory mismatch errors inside Flatpak sandbox
          rm -rf build/CMakeCache.txt build/CMakeFiles
          # Build the Flatpak app using our manifest and export to a local repo directory
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --repo=repo --user --install-deps-from=flathub build-dir org.arthur.TranslationLayer.json
          flatpak build-bundle repo arthur-translation-layer.flatpak org.arthur.TranslationLayer

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arthur-translation-layer.flatpak
            build/pw_module_clls
            build/midi_sync
            build/arthur_bridge.so
            build/arthur-daemon
            build/win_guest_agent.exe
            build/win_guest_agent.exe.so
            build/arthur-guest.exe
            build/arthur-guest.exe.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
