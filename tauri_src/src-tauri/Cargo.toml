[package]
name = "arthur-control-center"
version = "3.2.0"
description = "Arthur Translation Layer Control Center"
authors = ["danny1marshall1587-maker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0" }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

