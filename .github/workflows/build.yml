name: CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------------------------------
    # System Dependencies
    # -------------------------------------------------------------------------
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libasound2-dev \
          libpipewire-0.3-dev \
          libspa-0.2-dev \
          python3 \
          wget \
          file \
          netcat-openbsd

    # -------------------------------------------------------------------------
    # VST3 Headers (required by main.cpp / arthur_bridge)
    # -------------------------------------------------------------------------
    - name: Clone VST3 plugin interfaces
      run: |
        mkdir -p vst3_headers
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_pluginterfaces.git \
          vst3_headers/pluginterfaces
        git clone --depth 1 \
          https://github.com/steinbergmedia/vst3_base.git \
          vst3_headers/base

    # -------------------------------------------------------------------------
    # Build Linux-native targets (no Qt GUI in CI — too heavy)
    # -------------------------------------------------------------------------
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_GUI=OFF

    - name: Build all native targets
      run: cmake --build build --config Release -j$(nproc)

    # -------------------------------------------------------------------------
    # Daemon health check — verify daemon starts and accepts IPC commands.
    # The full arthur_stress_test requires Wine (not available in CI), so we
    # run a lightweight UNIX socket smoke test instead.
    # -------------------------------------------------------------------------
    - name: Run daemon IPC health check
      run: |
        export XDG_RUNTIME_DIR=$(mktemp -d)
        chmod 700 "$XDG_RUNTIME_DIR"
        SOCK="${XDG_RUNTIME_DIR}/arthur.sock"

        # Start daemon in background
        ./build/arthur-daemon &
        DAEMON_PID=$!

        # Wait up to 5 seconds for socket to appear
        for i in $(seq 1 10); do
          [ -S "$SOCK" ] && break
          sleep 0.5
        done

        if [ ! -S "$SOCK" ]; then
          echo "[FAIL] Daemon socket did not appear at $SOCK"
          kill $DAEMON_PID 2>/dev/null || true
          exit 1
        fi
        echo "[OK] Daemon socket up: $SOCK"

        # Send LIST_SHM command — daemon must respond (even if empty list)
        RESPONSE=$(echo "LIST_SHM" | nc -U -q1 "$SOCK" 2>/dev/null || true)
        echo "[OK] LIST_SHM response: '${RESPONSE}'"

        kill $DAEMON_PID 2>/dev/null || true
        wait $DAEMON_PID 2>/dev/null || true
        echo "[PASS] Daemon IPC health check complete."

    # -------------------------------------------------------------------------
    # Build the stress test binary (validates it compiles; execution needs Wine)
    # -------------------------------------------------------------------------
    - name: Verify stress test binary is executable
      run: |
        ls -lh build/arthur_stress_test
        file build/arthur_stress_test

    # -------------------------------------------------------------------------
    # Upload native binaries as CI artifact
    # -------------------------------------------------------------------------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arthur-native-binaries
        path: |
          build/arthur_bridge.so
          build/arthur-daemon
          build/pw_module_clls
          build/midi_sync
          build/arthur_stress_test
        if-no-files-found: error
        retention-days: 7
